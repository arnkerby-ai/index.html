<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DCCFI – Spin the Wheel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');

  :root {
    --gold:#c9a84c; --dark:#1a1a2e; --panel:#16213e;
    --accent:#0f3460; --white:#fff; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#1a1a2e 0%,#0f3460 60%,#16213e 100%);
    min-height:100vh; color:var(--white); overflow-x:hidden;
  }

  /* ── HEADER ── */
  header{
    display:flex; align-items:center; justify-content:center;
    gap:18px; padding:16px 24px 12px;
    background:rgba(0,0,0,.4);
    border-bottom:2px solid var(--gold);
  }
  #logoImg{
    width:80px; height:80px; border-radius:50%;
    border:3px solid var(--gold); object-fit:cover;
    box-shadow:0 0 20px rgba(201,168,76,.55);
  }
  .title-block h1{
    font-size:2rem; font-weight:900; color:var(--gold);
    text-shadow:0 2px 8px rgba(0,0,0,.7); letter-spacing:3px;
  }
  .title-block p{font-size:.75rem;letter-spacing:3px;color:#ccc;text-transform:uppercase;}

  /* ── MAIN ── */
  main{
    display:flex; flex-wrap:wrap; justify-content:center;
    align-items:flex-start; gap:28px;
    padding:28px 20px 48px; max-width:1220px; margin:0 auto;
  }

  /* ── WHEEL ── */
  .wheel-section{
    display:flex; flex-direction:column; align-items:center;
    gap:18px; flex:1 1 420px; min-width:300px;
  }
  .wheel-wrapper{position:relative;display:flex;justify-content:center;align-items:center;}
  .pointer{
    position:absolute; top:-18px; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:18px solid transparent; border-right:18px solid transparent;
    border-top:46px solid var(--gold);
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.7));
    z-index:10;
  }
  #wheelCanvas{
    border-radius:50%;
    box-shadow:0 0 44px rgba(201,168,76,.4),0 8px 32px rgba(0,0,0,.8);
    display:block;
  }
  .hub{
    position:absolute; width:54px; height:54px; border-radius:50%;
    background:radial-gradient(circle,#fff 30%,var(--gold) 100%);
    border:4px solid #fff; box-shadow:0 0 14px rgba(0,0,0,.55);
    top:50%; left:50%; transform:translate(-50%,-50%); z-index:5;
  }

  #spinBtn{
    padding:14px 60px; font-size:1.15rem; font-weight:700;
    letter-spacing:2px; text-transform:uppercase;
    background:linear-gradient(135deg,var(--gold),#e8c96d,var(--gold));
    color:#1a1a2e; border:none; border-radius:50px; cursor:pointer;
    box-shadow:0 6px 24px rgba(201,168,76,.5);
    transition:transform .15s,box-shadow .15s;
  }
  #spinBtn:hover:not(:disabled){transform:scale(1.07);box-shadow:0 10px 30px rgba(201,168,76,.7);}
  #spinBtn:disabled{opacity:.5;cursor:not-allowed;}

  /* ── WINNER ── */
  #winnerBanner{
    display:none; flex-direction:column; align-items:center; gap:5px;
    background:linear-gradient(135deg,rgba(201,168,76,.22),rgba(201,168,76,.05));
    border:2px solid var(--gold); border-radius:var(--radius);
    padding:16px 32px; text-align:center; width:100%; max-width:400px;
    animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  #winnerBanner.show{display:flex;}
  .winner-label{font-size:.75rem;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
  .winner-name{font-size:2rem;font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(201,168,76,.8);}
  .btn-remove-winner{
    padding:8px 14px; border:1px solid rgba(255,126,126,.65); border-radius:8px;
    background:rgba(255,126,126,.12); color:#ffb0b0; cursor:pointer;
    font:600 .82rem 'Poppins',sans-serif; transition:background .15s;
  }
  .btn-remove-winner:hover{background:rgba(255,126,126,.24);}
  @keyframes popIn{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}

  /* ── JESUS ── */
  .jesus-section{
    display:flex; flex-direction:column; align-items:center;
    justify-content:flex-end; gap:0;
    min-width:160px; flex:0 0 185px; align-self:flex-end;
  }
  .speech-bubble{
    position:relative; background:#fff; color:#333;
    border-radius:12px; padding:9px 14px;
    font-size:.78rem; font-weight:600; text-align:center;
    max-width:170px; box-shadow:0 4px 14px rgba(0,0,0,.35);
    min-height:36px; display:flex; align-items:center; justify-content:center;
    margin-bottom:12px;
  }
  .speech-bubble::after{
    content:''; position:absolute; bottom:-12px; left:50%;
    transform:translateX(-50%);
    border-left:10px solid transparent; border-right:10px solid transparent;
    border-top:12px solid #fff;
  }
  #jesusImg{
    width:170px; filter:drop-shadow(4px 6px 14px rgba(0,0,0,.55));
    transform-origin:bottom center;
  }
  .jesus-label{
    font-size:.65rem; color:var(--gold); letter-spacing:1px;
    margin-top:14px; text-transform:uppercase;
  }

  /* Jesus animations */
  @keyframes sway{
    0%,100%{transform:rotate(-3deg);}
    50%{transform:rotate(3deg);}
  }
  @keyframes dance{
    0%  {transform:rotate(-10deg) translateY(0);}
    15% {transform:rotate(10deg)  translateY(-10px);}
    30% {transform:rotate(-12deg) translateY(0);}
    45% {transform:rotate(12deg)  translateY(-12px);}
    60% {transform:rotate(-7deg)  translateY(0);}
    75% {transform:rotate(7deg)   translateY(-8px);}
    90% {transform:rotate(-3deg)  translateY(0);}
    100%{transform:rotate(0deg)   translateY(0);}
  }
  @keyframes celebrate{
    0%,100%{transform:translateY(0) scale(1) rotate(0deg);}
    20%{transform:translateY(-20px) scale(1.08) rotate(-6deg);}
    50%{transform:translateY(0)     scale(.95)  rotate(0deg);}
    70%{transform:translateY(-12px) scale(1.05) rotate(6deg);}
  }
  #jesusImg.idle      {animation:sway 2.5s ease-in-out infinite;}
  #jesusImg.spinning  {animation:dance .55s ease-in-out infinite;}
  #jesusImg.celebrate {animation:celebrate .5s ease-in-out 4;}

  /* ── CRUD ── */
  .crud-panel{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(201,168,76,.3);
    border-radius:var(--radius); padding:22px;
    flex:1 1 300px; min-width:270px; max-width:370px;
  }
  .crud-panel h2{
    font-size:1.05rem; font-weight:700; color:var(--gold);
    margin-bottom:14px; letter-spacing:1px;
    display:flex; align-items:center; gap:8px;
  }
  .input-row{display:flex;gap:8px;margin-bottom:14px;}
  .input-row input{
    flex:1; padding:10px 14px; border-radius:8px;
    border:1.5px solid rgba(201,168,76,.4);
    background:rgba(255,255,255,.08); color:#fff;
    font-family:'Poppins',sans-serif; font-size:.88rem;
    outline:none; transition:border-color .2s;
  }
  .input-row input::placeholder{color:#aaa;}
  .input-row input:focus{border-color:var(--gold);}
  .btn-add{
    padding:10px 16px; background:var(--gold); color:#1a1a2e;
    font-weight:700; border:none; border-radius:8px; cursor:pointer;
    font-family:'Poppins',sans-serif; font-size:.88rem;
    transition:transform .15s,background .2s; white-space:nowrap;
  }
  .btn-add:hover{background:#e8c96d;transform:scale(1.04);}
  .participant-actions{display:flex;gap:8px;margin-bottom:14px;}
  .btn-participant-action{
    flex:1;padding:9px 10px;border:1px solid rgba(201,168,76,.55);
    border-radius:8px;background:rgba(201,168,76,.12);color:#f1d98c;
    font:600 .78rem 'Poppins',sans-serif;cursor:pointer;transition:background .15s;
  }
  .btn-participant-action:hover{background:rgba(201,168,76,.24);}
  #uploadNamesInput{display:none;}

  #nameList{
    list-style:none; display:flex; flex-direction:column;
    gap:7px; max-height:360px; overflow-y:auto; padding-right:4px;
  }
  #nameList::-webkit-scrollbar{width:5px;}
  #nameList::-webkit-scrollbar-track{background:transparent;}
  #nameList::-webkit-scrollbar-thumb{background:rgba(201,168,76,.4);border-radius:4px;}

  .name-item{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.07); border-radius:8px;
    padding:8px 12px; border:1px solid rgba(255,255,255,.08);
    transition:background .2s; animation:slideIn .22s ease;
  }
  @keyframes slideIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
  .name-item:hover{background:rgba(255,255,255,.12);}
  .name-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .name-text{flex:1;font-size:.88rem;font-weight:500;}
  .name-text.editing{
    background:rgba(255,255,255,.1); border:1px solid var(--gold);
    border-radius:4px; padding:2px 7px; outline:none;
    color:#fff; font-family:'Poppins',sans-serif; font-size:.88rem; width:100%;
  }
  .btn-icon{
    background:none; border:none; cursor:pointer;
    font-size:.95rem; padding:3px 5px; border-radius:5px;
    transition:background .15s; line-height:1;
  }
  .btn-edit{color:#7ec8ff;} .btn-edit:hover{background:rgba(126,200,255,.15);}
  .btn-save{color:#6dffb3;} .btn-save:hover{background:rgba(109,255,179,.15);}
  .btn-del {color:#ff7e7e;} .btn-del:hover {background:rgba(255,126,126,.15);}
  .count-badge{
    display:inline-block; background:var(--gold); color:#1a1a2e;
    font-size:.68rem; font-weight:700; padding:2px 9px;
    border-radius:20px; margin-left:auto;
  }
  .empty-msg{text-align:center;color:#888;font-size:.82rem;padding:22px 0;}

  /* ── CONFETTI ── */
  .confetti-piece{
    position:fixed; top:-20px; border-radius:2px;
    animation:confettiFall linear forwards;
    pointer-events:none; z-index:9999;
  }
  @keyframes confettiFall{
    0%  {transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
  }

  /* ── RESPONSIVE ── */
  @media(max-width:680px){
    .title-block h1{font-size:1.4rem;}
    .jesus-section{display:none;}
    main{gap:18px;}
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <img id="logoImg" alt="DCCFI Logo"/>
  <div class="title-block">
    <h1>✦ DCCFI ✦</h1>
    <p>Spin the Wheel &nbsp;•&nbsp; Where Everyone Is Important</p>
  </div>
</header>

<main>

  <!-- WHEEL SECTION -->
  <section class="wheel-section">
    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="420" height="420"></canvas>
      <div class="hub"></div>
    </div>
    <button id="spinBtn">🎉 &nbsp;SPIN!</button>
    <div id="winnerBanner">
      <span class="winner-label">🎊 Selected Member 🎊</span>
      <span class="winner-name" id="winnerName"></span>
      <button class="btn-remove-winner" id="removeWinnerBtn" type="button">🗑️ Remove from wheel</button>
    </div>
  </section>

  <!-- JESUS SECTION -->
  <section class="jesus-section">
    <div class="speech-bubble" id="bubbleText">Ready to spin! 🙏</div>
    <img id="jesusImg" alt="Jesus" class="idle"/>
    <div class="jesus-label">With you always ✝</div>
  </section>

  <!-- CRUD PANEL -->
  <section class="crud-panel">
    <h2>✝ &nbsp;Participants <span id="countBadge" class="count-badge">0</span></h2>
    <div class="input-row">
      <input type="text" id="nameInput" placeholder="Enter member name…" maxlength="40"/>
      <button class="btn-add" onclick="addName()">+ Add</button>
    </div>
    <div class="participant-actions">
      <button class="btn-participant-action" id="saveNamesBtn" type="button">⬇ Save TXT</button>
      <button class="btn-participant-action" id="uploadNamesBtn" type="button">📄 Upload names</button>
      <input id="uploadNamesInput" type="file" accept=".txt,.csv,text/plain,text/csv"/>
    </div>
    <ul id="nameList"></ul>
    <p class="empty-msg" id="emptyMsg">No names yet. Add your first member! 🙏</p>
  </section>

</main>

<script>
// ═══════════════════════════════════════
//  INLINE SVG ASSETS (guaranteed fallback)
// ═══════════════════════════════════════

// ═══════════════════════════════════════
//  LOAD IMAGES  (file-first → SVG fallback)
// ═══════════════════════════════════════
function svgToDataURL(svgStr) {
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
}

(function() {
  const logo = document.getElementById('logoImg');
  logo.onerror = function() {
    logo.src = svgToDataURL(LOGO_SVG);
    logo.onerror = null;
  };
  logo.src = 'dccfi-logo.png';
})();

(function() {
  const j = document.getElementById('jesusImg');
  j.onerror = function() {
    j.src = svgToDataURL(JESUS_SVG);
    j.onerror = null;
  };
  j.src = 'jesus-cartoon.png';
})();

// ═══════════════════════════════════════
//  WHEEL  STATE & COLORS
// ═══════════════════════════════════════
const COLORS = [
  '#e74c3c','#e67e22','#f1c40f','#27ae60',
  '#1abc9c','#2980b9','#8e44ad','#e91e63',
  '#ff5722','#00bcd4','#8bc34a','#ff9800',
  '#673ab7','#009688','#c0392b','#16a085'
];

let names        = [];
let currentAngle = 0;
let isSpinning   = false;

const canvas  = document.getElementById('wheelCanvas');
const ctx     = canvas.getContext('2d');
const spinBtn = document.getElementById('spinBtn');
const jesusImg= document.getElementById('jesusImg');
const bubble  = document.getElementById('bubbleText');

const SPIN_DURATION = 3000; // ms exactly

// ═══════════════════════════════════════
//  DRAW WHEEL
// ═══════════════════════════════════════
function drawWheel(angle) {
  const cx = canvas.width  / 2;
  const cy = canvas.height / 2;
  const r  = cx - 10;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (names.length === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, 'rgba(201,168,76,.18)');
    grad.addColorStop(1, 'rgba(255,255,255,.04)');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#c9a84c';
    ctx.lineWidth   = 5;
    ctx.stroke();
    ctx.fillStyle   = '#888';
    ctx.font        = 'bold 17px Poppins, sans-serif';
    ctx.textAlign   = 'center';
    ctx.textBaseline= 'middle';
    ctx.fillText('Add names to spin! 🙏', cx, cy);
    return;
  }

  const slice = (Math.PI * 2) / names.length;

  for (let i = 0; i < names.length; i++) {
    const start = angle + i * slice;
    const end   = start + slice;

    // Sector
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle   = COLORS[i % COLORS.length];
    ctx.fill();
    // Divider lines
    ctx.strokeStyle = 'rgba(255,255,255,.3)';
    ctx.lineWidth   = 2;
    ctx.stroke();

    // Label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + slice / 2);
    ctx.textAlign    = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle    = '#fff';
    ctx.shadowColor  = 'rgba(0,0,0,.55)';
    ctx.shadowBlur   = 5;
    const fs = names.length > 14 ? 9 : names.length > 10 ? 11 : names.length > 6 ? 13 : 15;
    ctx.font = `bold ${fs}px Poppins, sans-serif`;
    const label = names[i].length > 18 ? names[i].slice(0,17) + '…' : names[i];
    ctx.fillText(label, r - 16, 0);
    ctx.restore();
  }

  // Outer gold ring
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#c9a84c';
  ctx.lineWidth   = 7;
  ctx.stroke();

  // Inner shadow ring
  ctx.beginPath();
  ctx.arc(cx, cy, r - 4, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,.2)';
  ctx.lineWidth   = 3;
  ctx.stroke();
}

// ═══════════════════════════════════════
//  SPIN  (ease-out cubic, locked to 3 s)
// ═══════════════════════════════════════
function spin() {
  if (isSpinning || names.length < 2) {
    if (names.length < 2) {
      bubble.textContent = 'Add at least 2 members first! 😊';
    }
    return;
  }
  isSpinning = true;
  spinBtn.disabled = true;
  document.getElementById('winnerBanner').classList.remove('show');
  jesusImg.className = 'spinning';
  bubble.textContent = '🙏 Spinning… God bless!';

  const minRounds  = 6;
  const extraRnd   = Math.random() * 5;
  const totalDelta = (minRounds + extraRnd) * Math.PI * 2;
  const startAngle = currentAngle;
  const t0         = performance.now();

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  (function frame(now) {
    const elapsed = now - t0;
    const t       = Math.min(elapsed / SPIN_DURATION, 1);
    currentAngle  = startAngle + totalDelta * easeOut(t);
    drawWheel(currentAngle);
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      currentAngle = startAngle + totalDelta;
      drawWheel(currentAngle);
      resolveWinner();
    }
  })(t0);
}

function resolveWinner() {
  const slice  = (Math.PI * 2) / names.length;
  // Canvas angles start at the right; the pointer is at the top (-PI / 2).
  const norm   = ((-Math.PI / 2 - currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  const idx    = Math.floor(norm / slice) % names.length;
  const winner = names[idx];

  document.getElementById('winnerName').textContent = winner;
  document.getElementById('winnerBanner').classList.add('show');

  jesusImg.className  = 'celebrate';
  bubble.textContent  = `🎉 ${winner} is chosen!`;

  setTimeout(() => {
    jesusImg.className = 'idle';
    bubble.textContent = 'Praise the Lord! 🙌';
  }, 2400);

  isSpinning = false;
  spinBtn.disabled = false;
  launchConfetti();
}

spinBtn.addEventListener('click', spin);
document.getElementById('saveNamesBtn').addEventListener('click', saveNames);
const uploadNamesInput = document.getElementById('uploadNamesInput');
document.getElementById('uploadNamesBtn').addEventListener('click', () => uploadNamesInput.click());
uploadNamesInput.addEventListener('change', async () => {
  const file = uploadNamesInput.files[0];
  if (!file) return;
  try {
    const contents = await file.text();
    importNames(contents);
  } catch {
    bubble.textContent = 'Could not read that file. Please try a TXT or CSV file.';
  }
  uploadNamesInput.value = '';
});
document.getElementById('removeWinnerBtn').addEventListener('click', () => {
  const winner = document.getElementById('winnerName').textContent;
  const winnerIndex = names.indexOf(winner);
  if (winnerIndex !== -1) deleteName(winnerIndex);
  document.getElementById('winnerBanner').classList.remove('show');
});
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addName();
});

// ═══════════════════════════════════════
//  CRUD
// ═══════════════════════════════════════
function renderList() {
  const ul  = document.getElementById('nameList');
  const em  = document.getElementById('emptyMsg');
  document.getElementById('countBadge').textContent = names.length;
  ul.innerHTML = '';
  em.style.display = names.length ? 'none' : 'block';

  names.forEach((name, i) => {
    const li   = document.createElement('li');
    li.className = 'name-item';

    const dot  = document.createElement('div');
    dot.className = 'name-dot';
    dot.style.background = COLORS[i % COLORS.length];

    const span = document.createElement('span');
    span.className   = 'name-text';
    span.textContent = name;

    const btnEdit = document.createElement('button');
    btnEdit.className = 'btn-icon btn-edit';
    btnEdit.title     = 'Edit';
    btnEdit.innerHTML = '✏️';
    btnEdit.onclick   = () => startEdit(i, li, btnEdit, btnSave);

    const btnSave = document.createElement('button');
    btnSave.className   = 'btn-icon btn-save';
    btnSave.title       = 'Save';
    btnSave.innerHTML   = '💾';
    btnSave.style.display = 'none';
    btnSave.onclick     = () => commitEdit(i, li, btnEdit, btnSave);

    const btnDel = document.createElement('button');
    btnDel.className = 'btn-icon btn-del';
    btnDel.title     = 'Delete';
    btnDel.innerHTML = '🗑️';
    btnDel.onclick   = () => deleteName(i);

    li.append(dot, span, btnEdit, btnSave, btnDel);
    ul.appendChild(li);
  });

  drawWheel(currentAngle);
}

function addName() {
  const inp = document.getElementById('nameInput');
  const val = inp.value.trim();
  if (!val) { inp.focus(); return; }
  if (names.map(n=>n.toLowerCase()).includes(val.toLowerCase())) {
    inp.style.borderColor = '#ff7e7e';
    setTimeout(() => inp.style.borderColor = '', 1200);
    bubble.textContent = 'Name already exists! 😅';
    return;
  }
  names.push(val);
  inp.value = '';
  inp.focus();
  bubble.textContent = `${val} added! 🙏`;
  renderList();
}

function saveNames() {
  const file = new Blob([names.join('\r\n')], { type: 'text/plain;charset=utf-8' });
  const downloadUrl = URL.createObjectURL(file);
  const downloadLink = document.createElement('a');
  downloadLink.href = downloadUrl;
  downloadLink.download = 'participants.txt';
  downloadLink.click();
  setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);

  try {
    localStorage.setItem('dccfiParticipants', JSON.stringify(names));
    bubble.textContent = 'Names downloaded as participants.txt and saved on this device. ✅';
  } catch {
    bubble.textContent = 'Names downloaded as participants.txt. ✅';
  }
}

function importNames(contents) {
  const existing = new Set(names.map(name => name.toLowerCase()));
  const imported = contents.split(/[\r\n,;]+/)
    .map(name => name.trim())
    .filter(name => name && name.length <= 40 && !existing.has(name.toLowerCase()));
  const uniqueImported = imported.filter((name, index) => {
    const key = name.toLowerCase();
    if (existing.has(key)) return false;
    existing.add(key);
    return true;
  });
  names.push(...uniqueImported);
  renderList();
  bubble.textContent = uniqueImported.length
    ? `${uniqueImported.length} name${uniqueImported.length === 1 ? '' : 's'} added from file. 🙏`
    : 'No new names found in that file.';
}

function deleteName(i) {
  const removed = names.splice(i, 1)[0];
  bubble.textContent = `"${removed}" removed.`;
  renderList();
}

function startEdit(i, li, btnEdit, btnSave) {
  const span = li.querySelector('.name-text');
  if (!span) return;
  const inp  = document.createElement('input');
  inp.type      = 'text';
  inp.className = 'name-text editing';
  inp.value     = names[i];
  inp.maxLength = 40;
  span.replaceWith(inp);
  inp.focus();
  btnEdit.style.display = 'none';
  btnSave.style.display = '';
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') btnSave.click(); });
}

function commitEdit(i, li, btnEdit, btnSave) {
  const inp = li.querySelector('input.editing');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val) return;
  names[i] = val;
  bubble.textContent = `Updated to "${val}" ✅`;
  renderList();
}

// ═══════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════
function launchConfetti() {
  const colors = ['#c9a84c','#ff6b6b','#f7c59f','#6bcb77','#4d96ff','#fff','#f9ca24'];
  for (let i = 0; i < 90; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left        = Math.random() * 100 + 'vw';
    el.style.width       = (7 + Math.random() * 9) + 'px';
    el.style.height      = (7 + Math.random() * 9) + 'px';
    el.style.background  = colors[Math.floor(Math.random() * colors.length)];
    el.style.borderRadius= Math.random() > .5 ? '50%' : '2px';
    el.style.animationDuration = (1.6 + Math.random() * 2.2) + 's';
    el.style.animationDelay    = (Math.random() * .7) + 's';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
try {
  const savedNames = localStorage.getItem('dccfiParticipants');
  const parsedNames = savedNames === null ? null : JSON.parse(savedNames);
  names = Array.isArray(parsedNames)
    ? parsedNames.filter(name => typeof name === 'string' && name.trim()).map(name => name.trim())
    : ['Juan dela Cruz','Maria Santos','Pedro Reyes','Ana Garcia','Jose Lim','Rosa Cruz'];
} catch {
  names = ['Juan dela Cruz','Maria Santos','Pedro Reyes','Ana Garcia','Jose Lim','Rosa Cruz'];
}
renderList();
drawWheel(currentAngle);
</script>
