<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DCCFI – Spin the Wheel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');

  :root {
    --gold:#c9a84c; --dark:#1a1a2e; --panel:#16213e;
    --accent:#0f3460; --white:#fff; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#1a1a2e 0%,#0f3460 60%,#16213e 100%);
    min-height:100vh; color:var(--white); overflow-x:hidden;
  }

  /* ── HEADER ── */
  header{
    display:flex; align-items:center; justify-content:center;
    gap:18px; padding:16px 24px 12px;
    background:rgba(0,0,0,.4);
    border-bottom:2px solid var(--gold);
  }
  #logoImg{
    width:80px; height:80px; border-radius:50%;
    border:3px solid var(--gold); object-fit:cover;
    box-shadow:0 0 20px rgba(201,168,76,.55);
  }
  .title-block h1{
    font-size:2rem; font-weight:900; color:var(--gold);
    text-shadow:0 2px 8px rgba(0,0,0,.7); letter-spacing:3px;
  }
  .title-block p{font-size:.75rem;letter-spacing:3px;color:#ccc;text-transform:uppercase;}

  /* ── MAIN ── */
  main{
    display:flex; flex-wrap:wrap; justify-content:center;
    align-items:flex-start; gap:28px;
    padding:28px 20px 48px; max-width:1220px; margin:0 auto;
  }

  /* ── WHEEL ── */
  .wheel-section{
    display:flex; flex-direction:column; align-items:center;
    gap:18px; flex:1 1 420px; min-width:300px;
  }
  .wheel-wrapper{position:relative;display:flex;justify-content:center;align-items:center;}
  .pointer{
    position:absolute; top:-18px; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:18px solid transparent; border-right:18px solid transparent;
    border-top:46px solid var(--gold);
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.7));
    z-index:10;
  }
  #wheelCanvas{
    border-radius:50%;
    box-shadow:0 0 44px rgba(201,168,76,.4),0 8px 32px rgba(0,0,0,.8);
    display:block;
  }
  .hub{
    position:absolute; width:54px; height:54px; border-radius:50%;
    background:radial-gradient(circle,#fff 30%,var(--gold) 100%);
    border:4px solid #fff; box-shadow:0 0 14px rgba(0,0,0,.55);
    top:50%; left:50%; transform:translate(-50%,-50%); z-index:5;
  }

  #spinBtn{
    padding:14px 60px; font-size:1.15rem; font-weight:700;
    letter-spacing:2px; text-transform:uppercase;
    background:linear-gradient(135deg,var(--gold),#e8c96d,var(--gold));
    color:#1a1a2e; border:none; border-radius:50px; cursor:pointer;
    box-shadow:0 6px 24px rgba(201,168,76,.5);
    transition:transform .15s,box-shadow .15s;
  }
  #spinBtn:hover:not(:disabled){transform:scale(1.07);box-shadow:0 10px 30px rgba(201,168,76,.7);}
  #spinBtn:disabled{opacity:.5;cursor:not-allowed;}

  /* ── WINNER ── */
  #winnerBanner{
    display:none; flex-direction:column; align-items:center; gap:5px;
    background:linear-gradient(135deg,rgba(201,168,76,.22),rgba(201,168,76,.05));
    border:2px solid var(--gold); border-radius:var(--radius);
    padding:16px 32px; text-align:center; width:100%; max-width:400px;
    animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  #winnerBanner.show{display:flex;}
  .winner-label{font-size:.75rem;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
  .winner-name{font-size:2rem;font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(201,168,76,.8);}
  @keyframes popIn{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}

  /* ── SHEPHERD AND SHEEP ── */
  .mascot-section{
    position:relative; isolation:isolate;
    flex:0 0 246px; height:300px; margin-top:70px;
  }
  .mascot-shadow{
    position:absolute; inset:auto 12px 0; height:22px;
    background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 72%);
  }
  .speech-bubble{
    position:absolute; z-index:1; background:#fff8e8; color:#332821;
    max-width:154px; border-radius:12px; padding:8px 11px;
    font-size:.78rem; font-weight:700; text-align:center; overflow-wrap:anywhere;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .speech-bubble::after{
    content:''; position:absolute; bottom:-8px; left:50%;
    transform:translateX(-50%);
    border-left:7px solid transparent; border-right:7px solid transparent;
    border-top:8px solid #fff8e8;
  }
  #bubbleText{bottom:267px; left:3px;}
  #sheepBubble{bottom:173px; right:0;}
  .mascot-sprite{
    position:absolute; bottom:4px; width:126px;
    background:url('shepherd-and-sheep.png') no-repeat;
    background-size:auto 220px;
    transform-origin:bottom center;
  }
  .shepherd{
    left:6px; height:220px; background-position:-17px bottom;
    animation:shepherdStandby 3.4s ease-in-out infinite;
  }
  .sheep{
    right:1px; height:120px; background-position:-184px bottom;
    animation:sheepStandby 2.8s ease-in-out infinite;
  }
  .mascot-section.spinning .shepherd{animation:shepherdDance .86s ease-in-out infinite;}
  .mascot-section.spinning .sheep{animation:sheepDance .86s ease-in-out infinite;}
  @keyframes shepherdStandby{
    0%,100%{transform:rotate(0);}
    50%{transform:rotate(1.5deg);}
  }
  @keyframes sheepStandby{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.025,1.045);}
  }
  @keyframes shepherdDance{
    0%,100%{transform:translateX(-16px) rotate(-10deg);}
    25%{transform:translate(-8px,-29px) rotate(-7deg);}
    50%{transform:translateX(16px) rotate(10deg);}
    75%{transform:translate(8px,-29px) rotate(7deg);}
  }
  @keyframes sheepDance{
    0%,100%{transform:translateX(-9px) scale(1.12,.9);}
    25%{transform:translate(-12px,-34px) rotate(-12deg);}
    50%{transform:translateX(9px) scale(1.12,.9);}
    75%{transform:translate(13px,-32px) rotate(12deg);}
  }
  @media (prefers-reduced-motion:reduce){
    .mascot-section.spinning .mascot-sprite{animation:gentleStep 1.6s ease-in-out infinite;}
    @keyframes gentleStep{
      0%,100%{transform:translateX(-3px);}
      50%{transform:translateX(3px);}
    }
  }

  /* ── CRUD ── */
  .crud-panel{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(201,168,76,.3);
    border-radius:var(--radius); padding:22px;
    flex:1 1 300px; min-width:270px; max-width:370px;
  }
  .crud-panel h2{
    font-size:1.05rem; font-weight:700; color:var(--gold);
    margin-bottom:14px; letter-spacing:1px;
    display:flex; align-items:center; gap:8px;
  }
  .input-row{display:flex;gap:8px;margin-bottom:14px;}
  .input-row input{
    flex:1; min-width:0; padding:10px 14px; border-radius:8px;
    border:1.5px solid rgba(201,168,76,.4);
    background:rgba(255,255,255,.08); color:#fff;
    font-family:'Poppins',sans-serif; font-size:.88rem;
    outline:none; transition:border-color .2s;
  }
  .input-row input::placeholder{color:#aaa;}
  .input-row input:focus{border-color:var(--gold);}
  .btn-add{
    padding:10px 16px; background:var(--gold); color:#1a1a2e;
    font-weight:700; border:none; border-radius:8px; cursor:pointer;
    font-family:'Poppins',sans-serif; font-size:.88rem;
    transition:transform .15s,background .2s; white-space:nowrap;
  }
  .btn-add:hover{background:#e8c96d;transform:scale(1.04);}

  .name-file-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .btn-name-file{
    flex:1 1 auto; padding:8px 12px; border-radius:8px;
    background:rgba(201,168,76,.1); border:1px solid rgba(201,168,76,.45);
    color:#f5d985; font:inherit; font-size:.78rem; font-weight:600; cursor:pointer;
  }
  .btn-name-file:hover:not(:disabled){background:rgba(201,168,76,.22);}
  .btn-name-file:disabled{opacity:.5;cursor:not-allowed;}
  .name-file-status{font-size:.75rem;color:#e6dbbe;}
  .name-file-status:not(:empty){margin-bottom:12px;}

  #nameList{
    list-style:none; display:flex; flex-direction:column;
    gap:7px; max-height:360px; overflow-y:auto; padding-right:4px;
  }
  #nameList::-webkit-scrollbar{width:5px;}
  #nameList::-webkit-scrollbar-track{background:transparent;}
  #nameList::-webkit-scrollbar-thumb{background:rgba(201,168,76,.4);border-radius:4px;}

  .name-item{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.07); border-radius:8px;
    padding:8px 12px; border:1px solid rgba(255,255,255,.08);
    transition:background .2s; animation:slideIn .22s ease;
  }
  @keyframes slideIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
  .name-item:hover{background:rgba(255,255,255,.12);}
  .name-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .name-text{flex:1;font-size:.88rem;font-weight:500;}
  .name-text.editing{
    background:rgba(255,255,255,.1); border:1px solid var(--gold);
    border-radius:4px; padding:2px 7px; outline:none;
    color:#fff; font-family:'Poppins',sans-serif; font-size:.88rem; width:100%;
  }
  .btn-icon{
    background:none; border:none; cursor:pointer;
    font-size:.95rem; padding:3px 5px; border-radius:5px;
    transition:background .15s; line-height:1;
  }
  .btn-edit{color:#7ec8ff;} .btn-edit:hover{background:rgba(126,200,255,.15);}
  .btn-save{color:#6dffb3;} .btn-save:hover{background:rgba(109,255,179,.15);}
  .btn-del {color:#ff7e7e;} .btn-del:hover {background:rgba(255,126,126,.15);}
  .count-badge{
    display:inline-block; background:var(--gold); color:#1a1a2e;
    font-size:.68rem; font-weight:700; padding:2px 9px;
    border-radius:20px; margin-left:auto;
  }
  .empty-msg{text-align:center;color:#888;font-size:.82rem;padding:22px 0;}

  /* ── CONFETTI ── */
  .confetti-piece{
    position:fixed; top:-20px; border-radius:2px;
    animation:confettiFall linear forwards;
    pointer-events:none; z-index:9999;
  }
  @keyframes confettiFall{
    0%  {transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
  }

  /* ── RESPONSIVE ── */
  @media(max-width:680px){
    .title-block h1{font-size:1.4rem;}
    main{gap:18px;}
    .wheel-section{min-width:0;}
    .wheel-wrapper{width:min(100%,420px);}
    #wheelCanvas{width:100%;height:auto;}
    .mascot-section{margin-top:12px;}
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <img id="logoImg" alt="DCCFI Logo"/>
  <div class="title-block">
    <h1>✦ DCCFI ✦</h1>
    <p>Spin the Wheel &nbsp;•&nbsp; Where Everyone Is Important</p>
  </div>
</header>

<main>

  <!-- WHEEL SECTION -->
  <section class="wheel-section">
    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="420" height="420"></canvas>
      <div class="hub"></div>
    </div>
    <button id="spinBtn">🎉 &nbsp;SPIN!</button>
    <div id="winnerBanner">
      <span class="winner-label">🎊 Selected Member 🎊</span>
      <span class="winner-name" id="winnerName"></span>
    </div>
  </section>

  <!-- SHEPHERD AND SHEEP -->
  <section class="mascot-section" id="mascots" aria-label="Shepherd and sheep">
    <div class="mascot-shadow" aria-hidden="true"></div>
    <div class="mascot-sprite shepherd" role="img" aria-label="Shepherd"></div>
    <div class="mascot-sprite sheep" role="img" aria-label="Sheep"></div>
    <div class="speech-bubble" id="bubbleText" role="status">Ready to spin! 🙏</div>
    <div class="speech-bubble" id="sheepBubble" hidden></div>
  </section>

  <!-- CRUD PANEL -->
  <section class="crud-panel">
    <h2>✝ &nbsp;Participants <span id="countBadge" class="count-badge">0</span></h2>
    <div class="input-row">
      <input type="text" id="nameInput" placeholder="Enter member name…" maxlength="40"/>
      <button class="btn-add" onclick="addName()">+ Add</button>
    </div>
    <div class="name-file-actions">
      <button type="button" class="btn-name-file" id="saveNamesBtn">Save Names</button>
      <button type="button" class="btn-name-file" id="uploadNamesBtn">Upload Names</button>
      <input type="file" id="nameFileInput" accept=".txt,text/plain" hidden/>
    </div>
    <p class="name-file-status" id="nameFileStatus" role="status"></p>
    <ul id="nameList"></ul>
    <p class="empty-msg" id="emptyMsg">No names yet. Add your first member! 🙏</p>
  </section>

</main>

<script>
// ═══════════════════════════════════════
//  INLINE SVG ASSETS (guaranteed fallback)
// ═══════════════════════════════════════

// DCCFI Logo SVG (matches the provided logo style)
const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="99" fill="white" stroke="#c9a84c" stroke-width="3"/>
  <!-- Church building outline -->
  <line x1="100" y1="20" x2="100" y2="38" stroke="#1a1a2e" stroke-width="3"/>
  <line x1="94" y1="27" x2="106" y2="27" stroke="#1a1a2e" stroke-width="3"/>
  <!-- Roof -->
  <polygon points="68,70 100,42 132,70" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linejoin="round"/>
  <!-- Walls -->
  <rect x="72" y="68" width="56" height="38" fill="none" stroke="#1a1a2e" stroke-width="2.5"/>
  <!-- Door arch -->
  <path d="M88,106 L88,88 Q100,78 112,88 L112,106" fill="none" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Gold decorative arch behind building -->
  <path d="M50,80 Q100,45 150,80" fill="none" stroke="#c9a84c" stroke-width="4" stroke-linecap="round"/>
  <!-- People silhouettes left -->
  <circle cx="52" cy="88" r="7" fill="#c9a84c"/>
  <path d="M46,105 Q52,96 58,105" fill="#c9a84c"/>
  <circle cx="38" cy="94" r="6" fill="#c9a84c"/>
  <path d="M33,110 Q38,102 43,110" fill="#c9a84c"/>
  <!-- People silhouettes right -->
  <circle cx="148" cy="88" r="7" fill="#c9a84c"/>
  <path d="M142,105 Q148,96 154,105" fill="#c9a84c"/>
  <circle cx="162" cy="94" r="6" fill="#c9a84c"/>
  <path d="M157,110 Q162,102 167,110" fill="#c9a84c"/>
  <!-- Open Bible -->
  <path d="M62,112 Q100,106 138,112 Q100,120 62,112Z" fill="#c9a84c" opacity=".8"/>
  <path d="M62,112 L62,122 Q100,130 100,122 L100,112" fill="#e8d9b8"/>
  <path d="M138,112 L138,122 Q100,130 100,122 L100,112" fill="#f5f0e0"/>
  <line x1="100" y1="112" x2="100" y2="130" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Bible verse -->
  <rect x="80" y="108" width="40" height="12" rx="2" fill="white"/>
  <text x="100" y="117" text-anchor="middle" font-family="Georgia,serif" font-size="5.5" fill="#333">Luke 1: 78-79</text>
  <!-- DCCFI text -->
  <text x="100" y="148" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="22" fill="#1a1a2e" letter-spacing="1">DCCFI</text>
  <!-- Tagline curved -->
  <path id="arc" d="M 30,160 A 72,72 0 0,0 170,160" fill="none"/>
  <text font-family="Arial,sans-serif" font-size="8.5" fill="#1a1a2e" letter-spacing="2.5">
    <textPath href="#arc" startOffset="8%">WHERE EVERYONE IS IMPORTANT</textPath>
  </text>
</svg>`;

// ═══════════════════════════════════════
//  LOAD IMAGES  (file-first → SVG fallback)
// ═══════════════════════════════════════
function svgToDataURL(svgStr) {
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
}

(function() {
  const logo = document.getElementById('logoImg');
  logo.onerror = function() {
    logo.src = svgToDataURL(LOGO_SVG);
    logo.onerror = null;
  };
  logo.src = 'Untitled Design.png';
})();

// ═══════════════════════════════════════
//  WHEEL  STATE & COLORS
// ═══════════════════════════════════════
const COLORS = [
  '#e74c3c','#e67e22','#f1c40f','#27ae60',
  '#1abc9c','#2980b9','#8e44ad','#e91e63',
  '#ff5722','#00bcd4','#8bc34a','#ff9800',
  '#673ab7','#009688','#c0392b','#16a085'
];

let names        = [];
let currentAngle = 0;
let isSpinning   = false;

const canvas  = document.getElementById('wheelCanvas');
const ctx     = canvas.getContext('2d');
const spinBtn = document.getElementById('spinBtn');
const mascots = document.getElementById('mascots');
const bubble  = document.getElementById('bubbleText');
const sheepBubble = document.getElementById('sheepBubble');
const uploadNamesBtn = document.getElementById('uploadNamesBtn');
const nameFileInput = document.getElementById('nameFileInput');
const nameFileStatus = document.getElementById('nameFileStatus');

const SHEPHERD_CATCHPHRASE = 'Let’s go, flock!';
const SHEEP_CATCHPHRASE = 'Baa! Let’s spin!';
const NAME_STORAGE_KEY = 'dccfi-wheel-names';
const MAX_NAME_LENGTH = document.getElementById('nameInput').maxLength;

const SPIN_DURATION = 3000; // ms exactly

// ═══════════════════════════════════════
//  DRAW WHEEL
// ═══════════════════════════════════════
function drawWheel(angle) {
  const cx = canvas.width  / 2;
  const cy = canvas.height / 2;
  const r  = cx - 10;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (names.length === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, 'rgba(201,168,76,.18)');
    grad.addColorStop(1, 'rgba(255,255,255,.04)');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#c9a84c';
    ctx.lineWidth   = 5;
    ctx.stroke();
    ctx.fillStyle   = '#888';
    ctx.font        = 'bold 17px Poppins, sans-serif';
    ctx.textAlign   = 'center';
    ctx.textBaseline= 'middle';
    ctx.fillText('Add names to spin! 🙏', cx, cy);
    return;
  }

  const slice = (Math.PI * 2) / names.length;

  for (let i = 0; i < names.length; i++) {
    const start = angle + i * slice;
    const end   = start + slice;

    // Sector
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle   = COLORS[i % COLORS.length];
    ctx.fill();
    // Divider lines
    ctx.strokeStyle = 'rgba(255,255,255,.3)';
    ctx.lineWidth   = 2;
    ctx.stroke();

    // Label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + slice / 2);
    ctx.textAlign    = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle    = '#fff';
    ctx.shadowColor  = 'rgba(0,0,0,.55)';
    ctx.shadowBlur   = 5;
    const fs = names.length > 14 ? 9 : names.length > 10 ? 11 : names.length > 6 ? 13 : 15;
    ctx.font = `bold ${fs}px Poppins, sans-serif`;
    const label = names[i].length > 18 ? names[i].slice(0,17) + '…' : names[i];
    ctx.fillText(label, r - 16, 0);
    ctx.restore();
  }

  // Outer gold ring
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#c9a84c';
  ctx.lineWidth   = 7;
  ctx.stroke();

  // Inner shadow ring
  ctx.beginPath();
  ctx.arc(cx, cy, r - 4, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,.2)';
  ctx.lineWidth   = 3;
  ctx.stroke();
}

// ═══════════════════════════════════════
//  SPIN  (ease-out cubic, locked to 3 s)
// ═══════════════════════════════════════
function setStandbyMessage(message) {
  if (!isSpinning) bubble.textContent = message;
}

function spin() {
  if (isSpinning) return;
  if (names.length < 2) {
    setStandbyMessage('Add at least 2 members first! 😊');
    return;
  }
  isSpinning = true;
  spinBtn.disabled = true;
  uploadNamesBtn.disabled = true;
  document.getElementById('winnerBanner').classList.remove('show');
  mascots.classList.add('spinning');
  bubble.textContent = SHEPHERD_CATCHPHRASE;
  sheepBubble.textContent = SHEEP_CATCHPHRASE;
  sheepBubble.hidden = false;

  const minRounds  = 6;
  const extraRnd   = Math.random() * 5;
  const totalDelta = (minRounds + extraRnd) * Math.PI * 2;
  const startAngle = currentAngle;
  const t0         = performance.now();

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  (function frame(now) {
    const elapsed = now - t0;
    const t       = Math.min(elapsed / SPIN_DURATION, 1);
    currentAngle  = startAngle + totalDelta * easeOut(t);
    drawWheel(currentAngle);
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      currentAngle = startAngle + totalDelta;
      drawWheel(currentAngle);
      resolveWinner();
    }
  })(t0);
}

function resolveWinner() {
  mascots.classList.remove('spinning');
  sheepBubble.hidden = true;

  const fullTurn = Math.PI * 2;
  const slice = fullTurn / names.length;
  // Canvas angles start at the right, so the top pointer is at -90°.
  const pointerAngle = -Math.PI / 2;
  const angleOnWheel = ((pointerAngle - currentAngle) % fullTurn + fullTurn) % fullTurn;
  const winner = names[Math.floor(angleOnWheel / slice) % names.length];

  document.getElementById('winnerName').textContent = winner;
  document.getElementById('winnerBanner').classList.add('show');

  isSpinning = false;
  setStandbyMessage('Praise the Lord! 🙌');
  spinBtn.disabled = false;
  uploadNamesBtn.disabled = false;
  launchConfetti();
}

spinBtn.addEventListener('click', spin);
document.getElementById('saveNamesBtn').addEventListener('click', saveNames);
uploadNamesBtn.addEventListener('click', () => nameFileInput.click());
nameFileInput.addEventListener('change', uploadNames);
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addName();
});

// ═══════════════════════════════════════
//  CRUD
// ═══════════════════════════════════════
function renderList() {
  const ul  = document.getElementById('nameList');
  const em  = document.getElementById('emptyMsg');
  document.getElementById('countBadge').textContent = names.length;
  ul.innerHTML = '';
  em.style.display = names.length ? 'none' : 'block';

  names.forEach((name, i) => {
    const li   = document.createElement('li');
    li.className = 'name-item';

    const dot  = document.createElement('div');
    dot.className = 'name-dot';
    dot.style.background = COLORS[i % COLORS.length];

    const span = document.createElement('span');
    span.className   = 'name-text';
    span.textContent = name;

    const btnEdit = document.createElement('button');
    btnEdit.className = 'btn-icon btn-edit';
    btnEdit.title     = 'Edit';
    btnEdit.innerHTML = '✏️';
    btnEdit.onclick   = () => startEdit(i, li, btnEdit, btnSave);

    const btnSave = document.createElement('button');
    btnSave.className   = 'btn-icon btn-save';
    btnSave.title       = 'Save';
    btnSave.innerHTML   = '💾';
    btnSave.style.display = 'none';
    btnSave.onclick     = () => commitEdit(i, li, btnEdit, btnSave);

    const btnDel = document.createElement('button');
    btnDel.className = 'btn-icon btn-del';
    btnDel.title     = 'Delete';
    btnDel.innerHTML = '🗑️';
    btnDel.onclick   = () => deleteName(i);

    li.append(dot, span, btnEdit, btnSave, btnDel);
    ul.appendChild(li);
  });

  drawWheel(currentAngle);
}

function addName() {
  const inp = document.getElementById('nameInput');
  const val = inp.value.trim();
  if (!val) { inp.focus(); return; }
  if (names.map(n=>n.toLowerCase()).includes(val.toLowerCase())) {
    inp.style.borderColor = '#ff7e7e';
    setTimeout(() => inp.style.borderColor = '', 1200);
    setStandbyMessage('Name already exists! 😅');
    return;
  }
  names.push(val);
  inp.value = '';
  inp.focus();
  setStandbyMessage(`${val} added! 🙏`);
  renderList();
}

function deleteName(i) {
  const removed = names.splice(i, 1)[0];
  setStandbyMessage(`"${removed}" removed.`);
  renderList();
}

function startEdit(i, li, btnEdit, btnSave) {
  const span = li.querySelector('.name-text');
  if (!span) return;
  const inp  = document.createElement('input');
  inp.type      = 'text';
  inp.className = 'name-text editing';
  inp.value     = names[i];
  inp.maxLength = MAX_NAME_LENGTH;
  span.replaceWith(inp);
  inp.focus();
  btnEdit.style.display = 'none';
  btnSave.style.display = '';
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') btnSave.click(); });
}

function commitEdit(i, li, btnEdit, btnSave) {
  const inp = li.querySelector('input.editing');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val) return;
  names[i] = val;
  setStandbyMessage(`Updated to "${val}" ✅`);
  renderList();
}

// ═══════════════════════════════════════
//  SAVE AND UPLOAD NAMES
// ═══════════════════════════════════════
function loadSavedNames() {
  try {
    const saved = JSON.parse(localStorage.getItem(NAME_STORAGE_KEY));
    if (Array.isArray(saved) && saved.every(name =>
      typeof name === 'string' && name.trim() && name.length <= MAX_NAME_LENGTH && !/[\r\n]/.test(name)
    )) return saved;
  } catch {
    // Use the starter names if browser storage is unavailable or unreadable.
  }
  return null;
}

function saveNames() {
  let message = 'Download started. The browser did not keep a local copy.';
  try {
    localStorage.setItem(NAME_STORAGE_KEY, JSON.stringify(names));
    message = 'Names saved. Download started.';
  } catch {
    // The text file is still available when browser storage is disabled.
  }

  const file = new Blob([names.join('\r\n')], {type: 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(file);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'dccfi-names.txt';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  nameFileStatus.textContent = message;
}

async function uploadNames() {
  const file = nameFileInput.files[0];
  nameFileInput.value = '';
  if (!file) return;
  if (isSpinning) {
    nameFileStatus.textContent = 'Wait for the wheel to stop before uploading names.';
    return;
  }
  if (!/\.txt$/i.test(file.name)) {
    nameFileStatus.textContent = 'Choose a .txt file with one name per line.';
    return;
  }

  spinBtn.disabled = true;
  uploadNamesBtn.disabled = true;
  nameFileStatus.textContent = 'Reading names…';
  try {
    const text = await file.text();
    const knownNames = new Set(names.map(name => name.toLowerCase()));
    let added = 0;
    let duplicates = 0;
    let tooLong = 0;

    for (const line of text.split(/\r\n?|\n/)) {
      const name = line.trim();
      if (!name) continue;
      if (name.length > MAX_NAME_LENGTH) {
        tooLong++;
        continue;
      }
      const key = name.toLowerCase();
      if (knownNames.has(key)) {
        duplicates++;
        continue;
      }
      names.push(name);
      knownNames.add(key);
      added++;
    }
    if (added) renderList();
    const details = [`Added ${added} ${added === 1 ? 'name' : 'names'}.`];
    if (duplicates) details.push(`Skipped ${duplicates} ${duplicates === 1 ? 'duplicate' : 'duplicates'}.`);
    if (tooLong) details.push(`Skipped ${tooLong} over ${MAX_NAME_LENGTH} characters.`);
    nameFileStatus.textContent = details.join(' ');
  } catch {
    nameFileStatus.textContent = 'Could not read that file. Try another .txt file.';
  } finally {
    spinBtn.disabled = false;
    uploadNamesBtn.disabled = false;
  }
}

// ═══════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════
function launchConfetti() {
  const colors = ['#c9a84c','#ff6b6b','#f7c59f','#6bcb77','#4d96ff','#fff','#f9ca24'];
  for (let i = 0; i < 90; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left        = Math.random() * 100 + 'vw';
    el.style.width       = (7 + Math.random() * 9) + 'px';
    el.style.height      = (7 + Math.random() * 9) + 'px';
    el.style.background  = colors[Math.floor(Math.random() * colors.length)];
    el.style.borderRadius= Math.random() > .5 ? '50%' : '2px';
    el.style.animationDuration = (1.6 + Math.random() * 2.2) + 's';
    el.style.animationDelay    = (Math.random() * .7) + 's';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
names = loadSavedNames() ?? ['Juan dela Cruz','Maria Santos','Pedro Reyes','Ana Garcia','Jose Lim','Rosa Cruz'];
renderList();
</script>
